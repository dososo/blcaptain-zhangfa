<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>城市摄影师作品集</title><link rel="stylesheet" href="measure.css"><style>@layer measure;*{box-sizing:border-box}body{margin:0;background:var(--bg,#f5f5ef);color:var(--ink,#20352d);font-family:Arial,"PingFang SC",sans-serif;font-size:16px}:lang(zh){line-height:1.75}h1,h2,h3{line-height:1.35;font-weight:600;overflow-wrap:anywhere}h1{font-size:clamp(30px,4vw,60px);max-width:18em;margin:26px 0}h2{font-size:24px}h3{font-size:20px}p,li,dd{max-width:36em}p{margin:1em 0}a{color:inherit;text-underline-offset:5px}header,main,footer{max-width:1160px;margin:auto;padding:24px 40px}.notice{margin:0;background:var(--accent,#42644b);color:white;padding:10px 16px;font-size:14px;max-width:none}.eyebrow{font-size:14px;letter-spacing:.1em}section{margin:32px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.panel{background:var(--paper,#fff);padding:26px;border:1px solid var(--line,#cbd5cb)}.rule{border-top:1px solid var(--line,#cbd5cb);padding-top:22px}button,input,select,textarea{font:inherit;max-width:100%;border:1px solid var(--ink,#20352d);border-radius:2px;padding:10px 14px}button{background:var(--paper,#fff);color:inherit;cursor:pointer;min-height:44px}button[aria-pressed=true],button.primary{background:var(--accent,#42644b);color:white}button:disabled{cursor:not-allowed;opacity:.6}input,select,textarea{background:white;color:#20352d}textarea{width:100%;min-height:180px}label{display:block;margin:16px 0}input[type=checkbox]{width:20px;height:20px;vertical-align:middle}nav,.actions{display:flex;flex-wrap:wrap;gap:10px}output{display:block;padding:14px 0;font-weight:600}dt{font-size:14px;color:var(--muted,#52645a)}dd{margin:2px 0 18px;overflow-wrap:anywhere}dl>div{border-top:1px solid var(--line,#cbd5cb);padding-top:12px}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line,#cbd5cb)}.scroll{overflow:auto}footer{font-size:14px;border-top:1px solid var(--line,#cbd5cb)}.placeholder{display:grid;place-items:center;padding:30px;min-height:240px;border:1px solid var(--line,#cbd5cb);background:var(--empty,#e5e8df);text-align:center;color:var(--ink,#20352d)}.placeholder p{max-width:22em}.small{font-size:14px}dialog{color:inherit;background:var(--bg,#f5f5ef);width:min(90vw,800px);max-height:90vh;overflow:auto;border:1px solid;padding:28px}dialog::backdrop{background:#13271fd0}:focus-visible{outline:3px solid #de6a1a;outline-offset:4px}[hidden]{display:none!important}@media(max-width:700px){header,main,footer{padding:20px}.grid,.three{grid-template-columns:1fr}h1{font-size:34px}.panel{padding:20px}th,td{padding:8px;font-size:14px}}.gallery{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:28px;align-items:start}body{--bg:#e9e6dd;--accent:#635c46;--ink:#302d23;--line:#a69f8b;--empty:#d5d0c4}@media(max-width:700px){.gallery{grid-template-columns:1fr}}.gallery>*{min-width:0}.gallery .placeholder{min-height:0;min-width:0}@media(max-width:700px){.gallery{grid-template-columns:minmax(0,1fr)}} </style></head><body><header><p class="notice">演示内容，仅用于中文网页设计评测。</p></header><main><div class="eyebrow">沈行（演示人物） / 城市观察索引</div><h1>在转角处，停一会儿</h1><p>摄影师和作品均为演示，没有提供真实摄影图片。</p><nav><button data-filter="全部" aria-pressed="true">全部</button><button data-filter="街角" aria-pressed="false">街角</button><button data-filter="夜行" aria-pressed="false">夜行</button><button data-filter="水岸" aria-pressed="false">水岸</button></nav><section class="gallery"><article data-theme="夜行"><div class="placeholder" style="aspect-ratio:3/2" role="img" aria-label="末班车之后：缺省图像占位，非真实摄影"><p>3:2 · 缺省图像占位</p></div><h2>末班车之后</h2><p>P01 / 夜行</p><button data-open="0">查看作品说明</button></article><article data-theme="水岸"><div class="placeholder" style="aspect-ratio:4/5" role="img" aria-label="午后水线：缺省图像占位，非真实摄影"><p>4:5 · 缺省图像占位</p></div><h2>午后水线</h2><p>P02 / 水岸</p><button data-open="1">查看作品说明</button></article><article data-theme="街角"><div class="placeholder" style="aspect-ratio:1/1" role="img" aria-label="转角的小窗：缺省图像占位，非真实摄影"><p>1:1 · 缺省图像占位</p></div><h2>转角的小窗</h2><p>P03 / 街角</p><button data-open="2">查看作品说明</button></article></section><dialog id="detail"><button id="close">关闭作品说明</button><div id="detail-content"></div></dialog></main><footer><p>所有名称、人物、数据均为演示样本，不对应真实机构、客户或产品。</p><p>摄影师和作品均为演示，没有提供真实摄影图片。</p></footer><script>const works=[{"编号":"P01","名称":"末班车之后","主题":"夜行","地点":"示例市东城老客运站南侧临时公交接驳通道（演示）","日期":"2026年9月（演示）","比例":"3:2","注释":"观察站台灯光与行人停留的关系；图像为缺省占位，不能视作真实拍摄。"},{"编号":"P02","名称":"午后水线","主题":"水岸","地点":"示例市南岸亲水步道（演示）","日期":"2026年8月（演示）","比例":"4:5","注释":"以竖幅组织树影、栏杆与水面，当前没有授权图片。"},{"编号":"P03","名称":"转角的小窗","主题":"街角","地点":"示例市西街（演示）","日期":"2026年7月（演示）","比例":"1:1","注释":"注释与分类为演示内容。"}];document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelectorAll('[data-theme]').forEach(x=>x.hidden=b.dataset.filter!=='全部'&&x.dataset.theme!==b.dataset.filter)});let opener;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{opener=b;const item=works[b.dataset.open],div=document.querySelector('#detail-content');div.replaceChildren();for(const [k,v] of Object.entries(item)){const p=document.createElement('p');p.textContent=k+'：'+v;div.append(p)}document.querySelector('#detail').showModal()});document.querySelector('#close').onclick=()=>document.querySelector('#detail').close();document.querySelector('#detail').onclose=()=>opener.focus();</script></body></html>
