<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>支持工作台回复流程改版 · 冻结输入</title><style>*{box-sizing:border-box}body{margin:0;color:#202a35;background:#f5f7fa;font:16px/1.7 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:28px 20px}h1{font-size:28px;line-height:1.4}h2{font-size:22px}p,li,dd{max-width:40em}dt{font-weight:600;margin-top:20px}dd{margin:4px 0 20px}button,input,select,textarea{font:inherit;padding:8px 12px;max-width:100%}button{cursor:pointer;margin:4px;border:1px solid #8895a7;background:white;border-radius:4px}input,textarea,select{border:1px solid #8895a7;border-radius:4px}textarea{display:block;width:100%;min-height:100px}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px;border-bottom:1px solid #d4dce6}th{background:#edf1f6}.scroll{overflow:auto}label{display:block;margin:12px 0}.notice{padding:10px 14px;background:#fff5cf;border:1px solid #e5d89a;font-size:14px}article{background:white;border:1px solid #d7dfe8;padding:20px;margin:20px 0}:focus-visible{outline:3px solid #1768b2;outline-offset:3px}[hidden]{display:none!important}.row{display:flex;gap:12px;flex-wrap:wrap}output{display:block;padding:12px 0}</style><link rel="stylesheet" href="measure.css"><link rel="stylesheet" href="style.css"></head><body><main><p class="notice">演示内容，仅用于中文网页设计评测。 这是审阅或改版的冻结输入，不是已验收成品。</p><h1>支持工作台</h1><label>搜索工单<input id="search" type="search"></label><div id="tickets"></div><article id="detail" hidden><h2 id="subject"></h2><p id="customer"></p><p id="message"></p><p>您好，这是本地演示回复。请在文件列表核对完整文件名与修改时间；此消息不会发送到外部系统。</p><label>演示回复<textarea id="reply"></textarea></label><button id="fail">模拟提交失败</button><button id="retry">重试演示回复</button><output id="state" aria-live="polite">草稿尚未提交</output></article><footer class="facts"><p>所有名称、人物、数据均为演示样本，不对应真实机构、客户或产品。</p><p>人物、工单、邮箱为合成；example.invalid不可发送。</p><p>回复仅在当前页面模拟成功，不触发任何外发消息。</p></footer></main><script>const tickets=[{"编号":"TK-001","主题":"演示设备连接说明在哪里","状态":"已处理","客户":"陈禾（演示）","邮箱":"chenhe@example.invalid","正文":"请提供演示设备连接指引。"},{"编号":"TK-002","主题":"导出的中文文件名包含括号时无法辨认版本","状态":"未处理","客户":"周舟（演示）","邮箱":"zhouzhou@example.invalid","正文":"我保存了“项目总结（第二次修订）”，请问如何在演示界面区分最新版本？"}];const search=document.querySelector('#search'),list=document.querySelector('#tickets');const drafts={};let selected=null;document.querySelector('#reply').oninput=e=>{if(selected)drafts[selected]=e.target.value};function draw(){list.innerHTML='';for(const t of tickets.filter(t=>(t.编号+t.主题).includes(search.value))){const b=document.createElement('button');b.textContent=t.编号+' '+t.主题+' · '+t.状态;b.onclick=()=>{selected=t.编号;document.querySelector('#reply').value=drafts[selected]||'';document.querySelector('#state').textContent='草稿尚未提交';document.querySelector('#detail').hidden=false;document.querySelector('#subject').textContent=t.主题;document.querySelector('#customer').textContent=t.客户+' · '+t.邮箱;document.querySelector('#message').textContent=t.正文};list.append(b)}}search.oninput=draw;document.querySelector('#fail').onclick=()=>document.querySelector('#state').textContent='演示提交失败，草稿已保留';document.querySelector('#retry').onclick=()=>document.querySelector('#state').textContent=document.querySelector('#reply').value.trim()?'本地模拟回复成功，未发送真实消息':'请先填写演示回复';draw();</script></body></html>
