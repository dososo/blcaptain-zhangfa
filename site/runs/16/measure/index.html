<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>支持工作台回复流程改版 · 冻结输入</title><link rel="stylesheet" href="measure.css"><style>@layer measure;*{box-sizing:border-box}body{margin:0;background:var(--bg,#f5f5ef);color:var(--ink,#20352d);font-family:Arial,"PingFang SC",sans-serif;font-size:16px}:lang(zh){line-height:1.75}h1,h2,h3{line-height:1.35;font-weight:600;overflow-wrap:anywhere}h1{font-size:clamp(30px,4vw,60px);max-width:18em;margin:26px 0}h2{font-size:24px}h3{font-size:20px}p,li,dd{max-width:36em}p{margin:1em 0}a{color:inherit;text-underline-offset:5px}header,main,footer{max-width:1160px;margin:auto;padding:24px 40px}.notice{margin:0;background:var(--accent,#42644b);color:white;padding:10px 16px;font-size:14px;max-width:none}.eyebrow{font-size:14px;letter-spacing:.1em}section{margin:32px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.panel{background:var(--paper,#fff);padding:26px;border:1px solid var(--line,#cbd5cb)}.rule{border-top:1px solid var(--line,#cbd5cb);padding-top:22px}button,input,select,textarea{font:inherit;max-width:100%;border:1px solid var(--ink,#20352d);border-radius:2px;padding:10px 14px}button{background:var(--paper,#fff);color:inherit;cursor:pointer;min-height:44px}button[aria-pressed=true],button.primary{background:var(--accent,#42644b);color:white}button:disabled{cursor:not-allowed;opacity:.6}input,select,textarea{background:white;color:#20352d}textarea{width:100%;min-height:180px}label{display:block;margin:16px 0}input[type=checkbox]{width:20px;height:20px;vertical-align:middle}nav,.actions{display:flex;flex-wrap:wrap;gap:10px}output{display:block;padding:14px 0;font-weight:600}dt{font-size:14px;color:var(--muted,#52645a)}dd{margin:2px 0 18px;overflow-wrap:anywhere}dl>div{border-top:1px solid var(--line,#cbd5cb);padding-top:12px}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line,#cbd5cb)}.scroll{overflow:auto}footer{font-size:14px;border-top:1px solid var(--line,#cbd5cb)}.placeholder{display:grid;place-items:center;padding:30px;min-height:240px;border:1px solid var(--line,#cbd5cb);background:var(--empty,#e5e8df);text-align:center;color:var(--ink,#20352d)}.placeholder p{max-width:22em}.small{font-size:14px}dialog{color:inherit;background:var(--bg,#f5f5ef);width:min(90vw,800px);max-height:90vh;overflow:auto;border:1px solid;padding:28px}dialog::backdrop{background:#13271fd0}:focus-visible{outline:3px solid #de6a1a;outline-offset:4px}[hidden]{display:none!important}@media(max-width:700px){header,main,footer{padding:20px}.grid,.three{grid-template-columns:1fr}h1{font-size:34px}.panel{padding:20px}th,td{padding:8px;font-size:14px}}body{--bg:#f0f2f5;--ink:#243950;--accent:#3e5b7d;--line:#c3cfda}#tickets{display:grid;gap:10px;margin:24px 0}#tickets button{text-align:left;background:#fff;padding:18px}#detail{border-top:4px solid #3e5b7d;padding:28px;background:white}#state{color:#304e73}#search{display:block;width:100%;margin:10px 0}#customer{overflow-wrap:anywhere}</style></head><body><main><p class="notice">演示内容，仅用于中文网页设计评测。 这是审阅或改版的冻结输入，不是已验收成品。</p><h1>支持工作台</h1><label>搜索工单<input id="search" type="search"></label><div id="tickets"></div><article id="detail" hidden><h2 id="subject"></h2><p id="customer"></p><p id="message"></p><label>演示回复<textarea id="reply"></textarea></label><button id="fail">模拟提交失败</button><button id="retry">重试演示回复</button><output id="state" aria-live="polite">草稿尚未提交</output></article><p>所有名称、人物、数据均为演示样本，不对应真实机构、客户或产品。</p><p>人物、工单、邮箱为合成；example.invalid不可发送。</p><p>回复仅在当前页面模拟成功，不触发任何外发消息。</p><p>建议回复：您好，这是本地演示回复。请在文件列表核对完整文件名与修改时间；此消息不会发送到外部系统。</p><p>所有邮箱均为 example.invalid，不可发送。仅当前页面模拟，未触发外发消息。</p></main><script>const tickets=[{"编号":"TK-001","主题":"演示设备连接说明在哪里","状态":"已处理","客户":"陈禾（演示）","邮箱":"chenhe@example.invalid","正文":"请提供演示设备连接指引。"},{"编号":"TK-002","主题":"导出的中文文件名包含括号时无法辨认版本","状态":"未处理","客户":"周舟（演示）","邮箱":"zhouzhou@example.invalid","正文":"我保存了“项目总结（第二次修订）”，请问如何在演示界面区分最新版本？"}];let current=null;const drafts={};const search=document.querySelector('#search'),list=document.querySelector('#tickets');function draw(){list.innerHTML='';for(const t of tickets.filter(t=>(t.编号+t.主题).includes(search.value))){const b=document.createElement('button');b.textContent=t.编号+' '+t.主题+' · '+t.状态;b.onclick=()=>{if(current)drafts[current]=document.querySelector('#reply').value;current=t.编号;document.querySelector('#reply').value=drafts[current]||'';document.querySelector('#state').textContent='草稿尚未提交';document.querySelector('#detail').hidden=false;document.querySelector('#subject').textContent=t.主题;document.querySelector('#customer').textContent=t.客户+' · '+t.邮箱;document.querySelector('#message').textContent=t.正文};list.append(b)}}search.oninput=draw;document.querySelector('#fail').onclick=()=>document.querySelector('#state').textContent='演示提交失败，草稿已保留';document.querySelector('#retry').onclick=()=>document.querySelector('#state').textContent=document.querySelector('#reply').value.trim()?'本地模拟回复成功，未发送真实消息':'请先填写演示回复';draw();</script></body></html>
