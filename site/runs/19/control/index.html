<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公共服务材料准备清单 · 演示</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg,#f4f4f0);color:var(--ink,#202922);font:16px/1.75 system-ui,-apple-system,'PingFang SC',sans-serif}main{width:min(1180px,100%);margin:auto;padding:40px 32px 80px}header{border-bottom:1px solid var(--line,#ccd2c7);padding-bottom:24px;margin-bottom:36px}h1{font-size:clamp(30px,4.5vw,62px);line-height:1.25;letter-spacing:-.04em;margin:20px 0}h2{font-size:25px;line-height:1.4;margin:0 0 18px}h3{font-size:20px;line-height:1.5;margin:0 0 12px}p{margin:10px 0 20px}a{color:inherit;text-underline-offset:4px}button,input,select,textarea{font:inherit;max-width:100%}button{padding:10px 17px;border:1px solid var(--accent,#34533e);color:inherit;background:transparent;cursor:pointer;border-radius:4px;line-height:1.5}button:hover,button[aria-pressed=true]{background:var(--accent,#34533e);color:var(--buttonink,#fff)}button:disabled{opacity:.6;cursor:not-allowed}input,select,textarea{border:1px solid var(--line,#adb9ad);border-radius:4px;background:var(--paper,#fff);color:inherit;padding:10px 12px}textarea{display:block;width:100%;min-height:210px;resize:vertical}label{display:block;margin:16px 0}input[type=checkbox]{width:20px;height:20px;vertical-align:middle;accent-color:var(--accent,#34533e)}.demo{display:inline-block;border:1px solid currentColor;padding:3px 10px;font-size:13px;letter-spacing:.06em}.muted,small{color:var(--muted,#566158)}.lead{font-size:20px;max-width:42em}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.panel{padding:28px;background:var(--paper,#fff);border:1px solid var(--line,#ccd2c7)}.stack{display:grid;gap:16px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.actions button{margin:0}.note{padding:16px 20px;border-left:3px solid var(--accent,#34533e);background:var(--paper,#fff)}.meta{font-size:14px;letter-spacing:.04em}.kicker{font-size:14px;letter-spacing:.13em;text-transform:uppercase}.placeholder{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:210px;background:var(--placeholder,#dfe4dc);border:1px solid var(--line,#b2bcb0);padding:28px;text-align:center;gap:12px}.placeholder b{font-size:34px;line-height:1.35}.facts{margin-top:48px;padding-top:24px;border-top:1px solid var(--line,#ccd2c7);font-size:14px}.facts p{margin:8px 0}output{display:block;padding:14px 0;font-weight:600}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:16px 12px;border-bottom:1px solid var(--line,#ccd2c7);text-align:left}th{font-weight:600}dd{margin:4px 0 20px}dt{font-size:14px;color:var(--muted,#566158)}.scroll{overflow:auto;max-width:100%}.pill{display:inline-block;padding:3px 9px;border:1px solid var(--line,#ccd2c7);font-size:13px;border-radius:20px}button,a,input,textarea,select{touch-action:manipulation}:focus-visible{outline:3px solid var(--focus,#a44c18);outline-offset:4px}[hidden]{display:none!important}dialog{width:min(800px,calc(100% - 32px));max-height:90vh;overflow:auto;padding:28px;border:1px solid var(--line,#ccd2c7);background:var(--paper,#fff);color:inherit}dialog::backdrop{background:#131914bc}p,h1,h2,h3,button,li,dd,dt,output{overflow-wrap:anywhere}@media(max-width:700px){main{padding:24px 20px 60px}.grid,.three{grid-template-columns:1fr}.panel{padding:20px}h1{font-size:36px}.lead{font-size:18px}.placeholder{min-height:180px}th,td{padding:12px 8px}header{margin-bottom:24px}.actions button{flex-grow:1}}body{--bg:#edf4ee;--ink:#253c31;--accent:#3e6b52;--line:#c1cec7;--paper:#fff} .guide{display:grid;grid-template-columns:300px minmax(0,1fr);gap:56px}.guide li{padding-bottom:20px}.check{display:flex;align-items:flex-start;gap:18px;padding:25px;background:white;border:1px solid #c1cec7}.check input{flex-shrink:0;margin-top:5px}.check span>strong,.check span>span{display:block}.check small{letter-spacing:.08em}.check strong{font-size:20px;margin:5px 0 9px}@media(max-width:700px){.guide{grid-template-columns:1fr;gap:24px}.check{padding:20px}}</style></head><body><main><header><div class="actions" style="justify-content:space-between;align-items:center"><strong>阅读空间 · 准备指引</strong><span class="demo">演示内容，仅用于中文网页设计评测。</span></div><h1>公共阅读空间短时使用：准备指南</h1><p class="lead">合成场景：为一次不收费的小型阅读交流准备材料。</p></header><p class="note"><strong>演示指南，非政务服务</strong>。不接受实际提交。</p><div class="guide"><aside><h2>开始之前</h2><ol><li>确认活动是否符合演示空间用途。</li><li>准备四项材料。</li><li>完成本地清单核对；不提交任何材料。</li></ol><p class="meta">来源：章法评测原创合成流程，不对应真实政策。<br>更新时间：2026-10-29</p></aside><section><h2>四项材料，逐一核对</h2><label class="check"><input type="checkbox" value="M01"><span><small>M01</small><strong>活动主题与100字以内的内容说明</strong><span>可使用虚构示例，不填真实个人信息。</span></span></label><label class="check"><input type="checkbox" value="M02"><span><small>M02</small><strong>预计参加人数与时间安排</strong><span>给出开始、结束和布置时间。</span></span></label><label class="check"><input type="checkbox" value="M03"><span><small>M03</small><strong>所需桌椅与设备清单</strong><span>写明数量和用途。</span></span></label><label class="check"><input type="checkbox" value="M04"><span><small>M04</small><strong>演示联系人称呼</strong><span>不收集身份证、真实电话或证件。</span></span></label><output id="count" aria-live="polite">已准备 0／4 项，仅保存于当前会话。</output><button id="reset">全部复位</button></section></div><footer class="facts"><p>所有名称、人物、数据均为演示样本，不对应真实机构、客户或产品。</p><p>这是虚构公共空间的演示准备指南，不是政府办事流程，也不接受实际提交。</p></footer></main><script>const checks=[...document.querySelectorAll('input[type=checkbox]')];function count(){document.querySelector('#count').textContent='已准备 '+checks.filter(x=>x.checked).length+'／4 项，仅保存于当前会话。'}checks.forEach(x=>x.onchange=count);document.querySelector('#reset').onclick=()=>{checks.forEach(x=>x.checked=false);count()};</script></body></html>
