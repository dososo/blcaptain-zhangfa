<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公共阅读空间短时使用：准备指南</title><link rel="stylesheet" href="measure.css"><link rel="stylesheet" href="style.css"><style>/* 独立视觉审查后的局部修复；原文与主任务保持。 */.cjk-unit{display:inline-block;max-width:100%;font:inherit;color:inherit;letter-spacing:inherit;vertical-align:baseline}.checklist label{grid-template-columns:24px max-content minmax(0,1fr)}#progress{display:flex;flex-direction:column;align-items:start;gap:4px}.progress-count{font-size:22px}.progress-note{font-size:16px;font-weight:400}</style></head><body><p class="notice">演示内容，仅用于中文网页设计评测。</p><main><p>演示指南，非政务服务</p><h1>公共阅读空间<br><span class="cjk-unit">短时使用：</span><span class="cjk-unit">准备指南</span></h1><p>合成场景：为一次不收费的小型阅读交流准备材料。</p><div class="guide"><aside class="steps"><h2>准备顺序</h2><ol><li>确认活动是否符合演示空间用途。</li><li>准备四项材料。</li><li>完成本地清单核对；不提交任何材料。</li></ol><p>章法评测原创合成流程，不对应真实政策。</p><p>更新时间：2026-10-29</p></aside><section class="checklist"><label><input type="checkbox" data-check><span>M01</span><div><strong>活动主题与100字以内的内容说明</strong><p>可使用虚构示例，不填真实个人信息。</p></div></label><label><input type="checkbox" data-check><span>M02</span><div><strong>预计参加人数与时间安排</strong><p>给出开始、结束和布置时间。</p></div></label><label><input type="checkbox" data-check><span>M03</span><div><strong>所需桌椅与设备清单</strong><p>写明数量和用途。</p></div></label><label><input type="checkbox" data-check><span>M04</span><div><strong>演示联系人称呼</strong><p>不收集身份证、真实电话或证件。</p></div></label><output id="progress" aria-live="polite"><span class="progress-count">已准备 0／4 项，</span><span class="progress-note">仅保存于当前会话。</span></output><button id="reset">全部复位</button></section></div><footer class="facts"><p>所有名称、人物、数据均为演示样本，不对应真实机构、客户或产品。</p><p>这是虚构公共空间的演示准备指南，不是政府办事流程，也不接受实际提交。</p></footer></main><script src="app.js"></script></body></html>
