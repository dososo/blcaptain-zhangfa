<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地笔记工具的离线与同步边界</title><link rel="stylesheet" href="measure.css"><style>@layer measure;*{box-sizing:border-box}body{margin:0;background:var(--bg,#f5f5ef);color:var(--ink,#20352d);font-family:Arial,"PingFang SC",sans-serif;font-size:16px}:lang(zh){line-height:1.75}h1,h2,h3{line-height:1.35;font-weight:600;overflow-wrap:anywhere}h1{font-size:clamp(30px,4vw,60px);max-width:18em;margin:26px 0}h2{font-size:24px}h3{font-size:20px}p,li,dd{max-width:36em}p{margin:1em 0}a{color:inherit;text-underline-offset:5px}header,main,footer{max-width:1160px;margin:auto;padding:24px 40px}.notice{margin:0;background:var(--accent,#42644b);color:white;padding:10px 16px;font-size:14px;max-width:none}.eyebrow{font-size:14px;letter-spacing:.1em}section{margin:32px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.panel{background:var(--paper,#fff);padding:26px;border:1px solid var(--line,#cbd5cb)}.rule{border-top:1px solid var(--line,#cbd5cb);padding-top:22px}button,input,select,textarea{font:inherit;max-width:100%;border:1px solid var(--ink,#20352d);border-radius:2px;padding:10px 14px}button{background:var(--paper,#fff);color:inherit;cursor:pointer;min-height:44px}button[aria-pressed=true],button.primary{background:var(--accent,#42644b);color:white}button:disabled{cursor:not-allowed;opacity:.6}input,select,textarea{background:white;color:#20352d}textarea{width:100%;min-height:180px}label{display:block;margin:16px 0}input[type=checkbox]{width:20px;height:20px;vertical-align:middle}nav,.actions{display:flex;flex-wrap:wrap;gap:10px}output{display:block;padding:14px 0;font-weight:600}dt{font-size:14px;color:var(--muted,#52645a)}dd{margin:2px 0 18px;overflow-wrap:anywhere}dl>div{border-top:1px solid var(--line,#cbd5cb);padding-top:12px}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line,#cbd5cb)}.scroll{overflow:auto}footer{font-size:14px;border-top:1px solid var(--line,#cbd5cb)}.placeholder{display:grid;place-items:center;padding:30px;min-height:240px;border:1px solid var(--line,#cbd5cb);background:var(--empty,#e5e8df);text-align:center;color:var(--ink,#20352d)}.placeholder p{max-width:22em}.small{font-size:14px}dialog{color:inherit;background:var(--bg,#f5f5ef);width:min(90vw,800px);max-height:90vh;overflow:auto;border:1px solid;padding:28px}dialog::backdrop{background:#13271fd0}:focus-visible{outline:3px solid #de6a1a;outline-offset:4px}[hidden]{display:none!important}@media(max-width:700px){header,main,footer{padding:20px}.grid,.three{grid-template-columns:1fr}h1{font-size:34px}.panel{padding:20px}th,td{padding:8px;font-size:14px}}.workspace{display:grid;grid-template-columns:280px minmax(0,1fr);gap:30px}.note{display:block;width:100%;text-align:left;margin:8px 0;overflow-wrap:anywhere}#filename{font-size:22px}@media(max-width:800px){.workspace{grid-template-columns:1fr}}</style></head><body><header><p class="notice">演示内容，仅用于中文网页设计评测。</p></header><main><div class="eyebrow">留白笔记 · 当前会话</div><h1>先把想法留在手边</h1><p>离线时继续写，联网后再决定是否同步。</p><div class="workspace"><aside><h2>笔记</h2><button class="note" data-n="0">老城区公共阅读空间走访记录</button><button class="note" data-n="1">下周待核对的采访问题</button><button class="note" data-n="2">关于老城区公共阅读空间与夜间灯光的走访记录（第二次修订）.md</button></aside><section class="panel"><h2 id="filename">关于老城区公共阅读空间与夜间灯光的走访记录（第二次修订）.md</h2><label>笔记正文<textarea id="body">周四傍晚，记录下街角阅读室的入口照明、桌面高度与等候位置。下一次走访需要核对无障碍入口是否有明确指引。</textarea></label><div class="actions"><button id="action0">进入离线模式</button><button id="action1">模拟同步失败</button><button id="action2">重试同步</button></div><output id="state" aria-live="polite">正在本地编辑，尚未同步</output><p>此演示不具备持久存储、跨设备同步或端到端加密能力。</p><p>离线编辑只写入当前演示会话；刷新会重置样本。同步为本地状态模拟，不连接云端。</p></section></div></main><footer><p>所有名称、人物、数据均为演示样本，不对应真实机构、客户或产品。</p><p>离线编辑只写入当前演示会话；刷新会重置样本。</p><p>同步为本地状态模拟，不连接云端。</p></footer><script>const names=["老城区公共阅读空间走访记录","下周待核对的采访问题","关于老城区公共阅读空间与夜间灯光的走访记录（第二次修订）.md"];document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>document.querySelector('#filename').textContent=names[b.dataset.n]);const states=["正在本地编辑，尚未同步","演示网络中断，笔记仍保留在当前会话","本地模拟同步完成，未发送到服务器"];for(let i=0;i<3;i++)document.querySelector('#action'+i).onclick=()=>document.querySelector('#state').textContent=states[i];</script></body></html>
