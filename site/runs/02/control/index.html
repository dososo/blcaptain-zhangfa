<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地笔记工具的离线与同步边界 · 演示</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg,#f4f4f0);color:var(--ink,#202922);font:16px/1.75 system-ui,-apple-system,'PingFang SC',sans-serif}main{width:min(1180px,100%);margin:auto;padding:40px 32px 80px}header{border-bottom:1px solid var(--line,#ccd2c7);padding-bottom:24px;margin-bottom:36px}h1{font-size:clamp(30px,4.5vw,62px);line-height:1.25;letter-spacing:-.04em;margin:20px 0}h2{font-size:25px;line-height:1.4;margin:0 0 18px}h3{font-size:20px;line-height:1.5;margin:0 0 12px}p{margin:10px 0 20px}a{color:inherit;text-underline-offset:4px}button,input,select,textarea{font:inherit;max-width:100%}button{padding:10px 17px;border:1px solid var(--accent,#34533e);color:inherit;background:transparent;cursor:pointer;border-radius:4px;line-height:1.5}button:hover,button[aria-pressed=true]{background:var(--accent,#34533e);color:var(--buttonink,#fff)}button:disabled{opacity:.6;cursor:not-allowed}input,select,textarea{border:1px solid var(--line,#adb9ad);border-radius:4px;background:var(--paper,#fff);color:inherit;padding:10px 12px}textarea{display:block;width:100%;min-height:210px;resize:vertical}label{display:block;margin:16px 0}input[type=checkbox]{width:20px;height:20px;vertical-align:middle;accent-color:var(--accent,#34533e)}.demo{display:inline-block;border:1px solid currentColor;padding:3px 10px;font-size:13px;letter-spacing:.06em}.muted,small{color:var(--muted,#566158)}.lead{font-size:20px;max-width:42em}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.panel{padding:28px;background:var(--paper,#fff);border:1px solid var(--line,#ccd2c7)}.stack{display:grid;gap:16px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.actions button{margin:0}.note{padding:16px 20px;border-left:3px solid var(--accent,#34533e);background:var(--paper,#fff)}.meta{font-size:14px;letter-spacing:.04em}.kicker{font-size:14px;letter-spacing:.13em;text-transform:uppercase}.placeholder{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:210px;background:var(--placeholder,#dfe4dc);border:1px solid var(--line,#b2bcb0);padding:28px;text-align:center;gap:12px}.placeholder b{font-size:34px;line-height:1.35}.facts{margin-top:48px;padding-top:24px;border-top:1px solid var(--line,#ccd2c7);font-size:14px}.facts p{margin:8px 0}output{display:block;padding:14px 0;font-weight:600}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:16px 12px;border-bottom:1px solid var(--line,#ccd2c7);text-align:left}th{font-weight:600}dd{margin:4px 0 20px}dt{font-size:14px;color:var(--muted,#566158)}.scroll{overflow:auto;max-width:100%}.pill{display:inline-block;padding:3px 9px;border:1px solid var(--line,#ccd2c7);font-size:13px;border-radius:20px}button,a,input,textarea,select{touch-action:manipulation}:focus-visible{outline:3px solid var(--focus,#a44c18);outline-offset:4px}[hidden]{display:none!important}dialog{width:min(800px,calc(100% - 32px));max-height:90vh;overflow:auto;padding:28px;border:1px solid var(--line,#ccd2c7);background:var(--paper,#fff);color:inherit}dialog::backdrop{background:#131914bc}p,h1,h2,h3,button,li,dd,dt,output{overflow-wrap:anywhere}@media(max-width:700px){main{padding:24px 20px 60px}.grid,.three{grid-template-columns:1fr}.panel{padding:20px}h1{font-size:36px}.lead{font-size:18px}.placeholder{min-height:180px}th,td{padding:12px 8px}header{margin-bottom:24px}.actions button{flex-grow:1}}body{--bg:#f1f0e8;--accent:#455e4b;--paper:#fffef8} .notebook{display:grid;grid-template-columns:280px minmax(0,1fr);gap:32px}aside button{text-align:left}textarea{min-height:300px}@media(max-width:700px){.notebook{grid-template-columns:1fr}aside .stack{gap:8px}}</style></head><body><main><header><div class="actions" style="justify-content:space-between;align-items:center"><strong>留白笔记</strong><span class="demo">演示内容，仅用于中文网页设计评测。</span></div><h1>先把想法留在手边</h1><p class="lead">离线时继续写，联网后再决定是否同步。</p></header><div class="notebook"><aside><h2>笔记</h2><div class="stack"><button data-note="0">老城区公共阅读空间走访记录</button><button data-note="1">下周待核对的采访问题</button><button data-note="2">关于老城区公共阅读空间与夜间灯光的走访记录（第二次修订）.md</button></div><p class="meta">此演示不具备持久存储、跨设备同步或端到端加密能力。</p></aside><section class="panel"><p class="kicker">当前笔记</p><h2 id="filename">关于老城区公共阅读空间与夜间灯光的走访记录（第二次修订）.md</h2><label for="body">正文 · 可直接编辑</label><textarea id="body">周四傍晚，记录下街角阅读室的入口照明、桌面高度与等候位置。下一次走访需要核对无障碍入口是否有明确指引。</textarea><div class="actions"><button id="action0">进入离线模式</button><button id="action1">模拟同步失败</button><button id="action2">重试同步</button></div><output id="state" aria-live="polite">正在本地编辑，尚未同步</output><p class="meta">离线编辑只写入当前演示会话；刷新会重置样本。同步为本地状态模拟，不连接云端。</p></section></div><footer class="facts"><p>所有名称、人物、数据均为演示样本，不对应真实机构、客户或产品。</p><p>离线编辑只写入当前演示会话；刷新会重置样本。</p><p>同步为本地状态模拟，不连接云端。</p></footer></main><script>const notes=["老城区公共阅读空间走访记录","下周待核对的采访问题","关于老城区公共阅读空间与夜间灯光的走访记录（第二次修订）.md"];document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{document.querySelector('#filename').textContent=notes[b.dataset.note]});const statuses=["正在本地编辑，尚未同步","演示网络中断，笔记仍保留在当前会话","本地模拟同步完成，未发送到服务器"];for(let i=0;i<3;i++)document.querySelector('#action'+i).onclick=()=>document.querySelector('#state').textContent=statuses[i]+'；仅本地模拟，正文保留。';</script></body></html>
