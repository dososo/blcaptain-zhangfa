<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目列表与归档恢复改版 · 冻结输入</title><link rel="stylesheet" href="measure.css"><style>@layer measure;*{box-sizing:border-box}body{margin:0;background:var(--bg,#f5f5ef);color:var(--ink,#20352d);font-family:Arial,"PingFang SC",sans-serif;font-size:16px}:lang(zh){line-height:1.75}h1,h2,h3{line-height:1.35;font-weight:600;overflow-wrap:anywhere}h1{font-size:clamp(30px,4vw,60px);max-width:18em;margin:26px 0}h2{font-size:24px}h3{font-size:20px}p,li,dd{max-width:36em}p{margin:1em 0}a{color:inherit;text-underline-offset:5px}header,main,footer{max-width:1160px;margin:auto;padding:24px 40px}.notice{margin:0;background:var(--accent,#42644b);color:white;padding:10px 16px;font-size:14px;max-width:none}.eyebrow{font-size:14px;letter-spacing:.1em}section{margin:32px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.panel{background:var(--paper,#fff);padding:26px;border:1px solid var(--line,#cbd5cb)}.rule{border-top:1px solid var(--line,#cbd5cb);padding-top:22px}button,input,select,textarea{font:inherit;max-width:100%;border:1px solid var(--ink,#20352d);border-radius:2px;padding:10px 14px}button{background:var(--paper,#fff);color:inherit;cursor:pointer;min-height:44px}button[aria-pressed=true],button.primary{background:var(--accent,#42644b);color:white}button:disabled{cursor:not-allowed;opacity:.6}input,select,textarea{background:white;color:#20352d}textarea{width:100%;min-height:180px}label{display:block;margin:16px 0}input[type=checkbox]{width:20px;height:20px;vertical-align:middle}nav,.actions{display:flex;flex-wrap:wrap;gap:10px}output{display:block;padding:14px 0;font-weight:600}dt{font-size:14px;color:var(--muted,#52645a)}dd{margin:2px 0 18px;overflow-wrap:anywhere}dl>div{border-top:1px solid var(--line,#cbd5cb);padding-top:12px}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line,#cbd5cb)}.scroll{overflow:auto}footer{font-size:14px;border-top:1px solid var(--line,#cbd5cb)}.placeholder{display:grid;place-items:center;padding:30px;min-height:240px;border:1px solid var(--line,#cbd5cb);background:var(--empty,#e5e8df);text-align:center;color:var(--ink,#20352d)}.placeholder p{max-width:22em}.small{font-size:14px}dialog{color:inherit;background:var(--bg,#f5f5ef);width:min(90vw,800px);max-height:90vh;overflow:auto;border:1px solid;padding:28px}dialog::backdrop{background:#13271fd0}:focus-visible{outline:3px solid #de6a1a;outline-offset:4px}[hidden]{display:none!important}@media(max-width:700px){header,main,footer{padding:20px}.grid,.three{grid-template-columns:1fr}h1{font-size:34px}.panel{padding:20px}th,td{padding:8px;font-size:14px}}body{--accent:#385b81;--bg:#f1f4f7;--ink:#213c58;--line:#c5d2df}#projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}#projects article{background:white;border-top:4px solid #385b81;padding:24px}#projects h2{font-size:23px}#undo{position:sticky;bottom:20px;background:#213c58;color:white}@media(max-width:700px){#projects{grid-template-columns:1fr}}</style></head><body><main><p class="notice">演示内容，仅用于中文网页设计评测。 这是审阅或改版的冻结输入，不是已验收成品。</p><h1>项目清单</h1><p>不创建真实项目、不向成员发送通知。</p><label>负责人<select id="owner"><option>全部</option><option>周禾（演示）</option><option>陈汀（演示）</option></select></label><label><input id="archive" type="checkbox"> 显示已归档项目</label><div id="projects"></div><button id="undo" hidden>撤销恢复</button><output id="feedback" aria-live="polite"></output><p>所有名称、人物、数据均为演示样本，不对应真实机构、客户或产品。</p><p>所有项目与成员为演示；操作只影响当前会话。</p></main><script>const projects=[{"编号":"PJ-01","名称":"老城区公共阅读空间入口信息与无障碍路径梳理","负责人":"周禾（演示）","状态":"进行中","标签":["空间研究","待走访"]},{"编号":"PJ-02","名称":"河岸夜间照明观察资料整理与第二轮访谈准备","负责人":"周禾（演示）","状态":"已归档","标签":["资料整理","演示"]},{"编号":"PJ-03","名称":"书店周六活动说明页","负责人":"陈汀（演示）","状态":"进行中","标签":["活动"]}];let undo=null;const owner=document.querySelector('#owner'),archive=document.querySelector('#archive'),list=document.querySelector('#projects'),undoButton=document.querySelector('#undo');function draw(){list.innerHTML='';for(const p of projects.filter(p=>(owner.value==='全部'||p.负责人===owner.value)&&(archive.checked||p.状态!=='已归档'))){const el=document.createElement('article');const h=document.createElement('h2');h.textContent=p.名称;const info=document.createElement('p');info.textContent=p.编号+' · '+p.负责人+' · '+p.状态+' · '+p.标签.join('、');el.append(h,info);if(p.状态==='已归档'){const b=document.createElement('button');b.textContent='恢复项目';b.dataset.id=p.编号;b.onclick=()=>{undo=p;p.状态='进行中';undoButton.hidden=false;document.querySelector('#feedback').textContent='已恢复'+p.编号;draw();undoButton.focus()};el.append(b)}list.append(el)}}owner.onchange=archive.onchange=draw;undoButton.onclick=()=>{if(undo)undo.状态='已归档';undo=null;undoButton.hidden=true;document.querySelector('#feedback').textContent='已撤销恢复';draw();const restored=list.querySelector('[data-id="PJ-02"]');if(restored)restored.focus();else archive.focus()};draw();</script></body></html>
