<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目列表与归档恢复改版 · 冻结输入</title><style>*{box-sizing:border-box}body{margin:0;color:#202a35;background:#f5f7fa;font:16px/1.7 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:28px 20px}h1{font-size:28px;line-height:1.4}h2{font-size:22px}p,li,dd{max-width:40em}dt{font-weight:600;margin-top:20px}dd{margin:4px 0 20px}button,input,select,textarea{font:inherit;padding:8px 12px;max-width:100%}button{cursor:pointer;margin:4px;border:1px solid #8895a7;background:white;border-radius:4px}input,textarea,select{border:1px solid #8895a7;border-radius:4px}textarea{display:block;width:100%;min-height:100px}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px;border-bottom:1px solid #d4dce6}th{background:#edf1f6}.scroll{overflow:auto}label{display:block;margin:12px 0}.notice{padding:10px 14px;background:#fff5cf;border:1px solid #e5d89a;font-size:14px}article{background:white;border:1px solid #d7dfe8;padding:20px;margin:20px 0}:focus-visible{outline:3px solid #1768b2;outline-offset:3px}[hidden]{display:none!important}.row{display:flex;gap:12px;flex-wrap:wrap}output{display:block;padding:12px 0}body{background:#eff3f4;color:#233a43}main{max-width:1150px;padding:40px 28px}h1{font-size:40px}#projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}article{margin:0;padding:26px;border-top:4px solid #48717a;border-radius:8px}article h2{font-size:23px;overflow-wrap:anywhere}article p{line-height:1.9}label{display:inline-block;margin-right:24px}button{min-height:44px;border-color:#48717a;color:#294d56}#undo{background:#294d56;color:white;margin:24px 0}#feedback{font-weight:600}.notice{background:#e1ecef;border-color:#adc7cc}@media(max-width:700px){main{padding:24px 20px}#projects{grid-template-columns:1fr}h1{font-size:34px}label{display:block;margin-right:0}}</style></head><body><main><p class="notice">演示内容，仅用于中文网页设计评测。 所有操作仅影响当前会话。</p><h1>项目清单</h1><p>不创建真实项目、不向成员发送通知。</p><label>负责人<select id="owner"><option>全部</option><option>周禾（演示）</option><option>陈汀（演示）</option></select></label><label><input id="archive" type="checkbox"> 显示已归档项目</label><div id="projects"></div><button id="undo" hidden>撤销恢复</button><output id="feedback" aria-live="polite"></output><footer style="margin-top:36px;border-top:1px solid #bac4cc;padding-top:18px;font-size:14px"><p>所有名称、人物、数据均为演示样本，不对应真实机构、客户或产品。</p><p>所有项目与成员为演示；操作只影响当前会话。</p></footer></main><script>const projects=[{"编号":"PJ-01","名称":"老城区公共阅读空间入口信息与无障碍路径梳理","负责人":"周禾（演示）","状态":"进行中","标签":["空间研究","待走访"]},{"编号":"PJ-02","名称":"河岸夜间照明观察资料整理与第二轮访谈准备","负责人":"周禾（演示）","状态":"已归档","标签":["资料整理","演示"]},{"编号":"PJ-03","名称":"书店周六活动说明页","负责人":"陈汀（演示）","状态":"进行中","标签":["活动"]}];let undo=null;const owner=document.querySelector('#owner'),archive=document.querySelector('#archive'),list=document.querySelector('#projects'),undoButton=document.querySelector('#undo');function draw(){list.innerHTML='';for(const p of projects.filter(p=>(owner.value==='全部'||p.负责人===owner.value)&&(archive.checked||p.状态!=='已归档'))){const el=document.createElement('article');const h=document.createElement('h2');h.textContent=p.名称;const info=document.createElement('p');info.textContent=p.编号+' · '+p.负责人+' · '+p.状态+' · '+p.标签.join('、');el.append(h,info);if(p.状态==='已归档'){const b=document.createElement('button');b.textContent='恢复项目';b.dataset.id=p.编号;b.onclick=()=>{undo=p;p.状态='进行中';undoButton.hidden=false;document.querySelector('#feedback').textContent='已恢复'+p.编号+'；仅当前会话，不发送通知';draw();undoButton.focus()};el.append(b)}list.append(el)}}owner.onchange=archive.onchange=draw;undoButton.onclick=()=>{if(undo)undo.状态='已归档';undo=null;undoButton.hidden=true;document.querySelector('#feedback').textContent='已撤销恢复；仅当前会话';draw();const target=list.querySelector('[data-id="PJ-02"]');if(target)target.focus();else archive.focus()};draw();</script></body></html>
